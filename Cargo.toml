[package]
name = "yalive"
version = "0.1.0"
edition = "2024"
description = "A section-first Markdown knowledge vault and spaced-repetition TUI"
license = "MIT"

[dependencies]
anyhow = "1.0"
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
directories = "6.0"
fsrs = "2.0.4"
open = "5.3"
pulldown-cmark = "0.13"
rand = "0.9"
ratatui = "0.30"
regex = "1.11"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.9"
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"
