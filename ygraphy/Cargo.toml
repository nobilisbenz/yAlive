[package]
name = "ygraphy"
version = "0.1.0"
edition = "2024"
description = "Native wgpu graph view for yalive vaults"
license = "MIT"

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.21", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
glyphon = "0.7"
pollster = "0.4"
serde_json = "1.0"
wgpu = "23"
winit = "0.30"
yalive = { path = ".." }
