# Runs on every push and pull request.
#
# Before this existed the only workflow was `release.yml`, which fires on a
# version tag — so the first thing to run the test suite was the build that
# published the binary. A red test could only be discovered after release.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Only the TUI modules are format-gated. The rest of the tree predates
      # this workflow and reformatting it wholesale would bury every real diff
      # under whitespace.
      - name: Format (src/app)
        run: rustfmt --edition 2024 --check src/app/*.rs src/app/ui/*.rs

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

  neovim:
    name: Neovim plugin
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # The plugin needs 0.10 or newer for `vim.system` and `vim.fs.find`.
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Spec
        run: nvim --headless -c "luafile nvim/tests/video_spec.lua" -c "qa"

  pi:
    name: pi extension
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: pi/extensions/yalive
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: pi/extensions/yalive
        run: npm run check
